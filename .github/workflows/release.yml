name: Release Build
on:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - config: Yaran-2.0-amd64.json
            runner: ubuntu-latest
            artifact: yaran-amd64
          - config: Yaran-2.0-arm64.json
            runner: ubuntu-24.04-arm
            artifact: yaran-arm64
          - config: Yaran-Server-2.0-amd64.json
            runner: ubuntu-latest
            artifact: yaran-server-amd64
    uses: ./.github/workflows/image.yml
    with:
      config: ${{ matrix.config }}
      runner: ${{ matrix.runner }}
      artifact: ${{ matrix.artifact }}
      release: true
