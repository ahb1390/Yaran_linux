name: Build image
on:
  workflow_call:
    inputs:
      config:
        required: true
        type: string
      runner:
        required: true
        type: string
      artifact:
        required: true
        type: string
      release:
        default: false
        type: boolean
jobs:
  image:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        env:
          IMAGE_CONFIG: ${{ inputs.config }}
        run: |
          set -euo pipefail
          docker run --rm --privileged \
            -v "$GITHUB_WORKSPACE:/work" -w /work \
            debian:trixie bash scripts/ci-build.sh "$IMAGE_CONFIG" \
            2>&1 | tee build.log
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact }}-log
          path: build.log
      - name: Upload image and checksum
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact }}
          path: |
            output/*.iso
            output/*.sha256
          if-no-files-found: error
          compression-level: 0
      - name: Make build output writable for release packaging
        if: inputs.release
        run: |
          set -euo pipefail
          [[ -d output ]] || { echo "Build output directory is missing." >&2; exit 1; }
          sudo chown -R "$(id -u):$(id -g)" -- output
      - name: Split ISOs for GitHub Releases
        if: inputs.release
        run: bash scripts/split-release-isos.sh
      - name: Verify release assets are within GitHub limits
        if: inputs.release
        run: |
          set -euo pipefail
          shopt -s nullglob
          limit=2147483648
          status=0

          for file in output/*; do
            [[ -f $file ]] || continue
            size=$(stat -c%s -- "$file")
            if (( size >= limit )); then
              echo "::error file=${file}::${file} is ${size} bytes; GitHub rejects release assets of ${limit} bytes or more"
              status=1
            fi
            case "$file" in
              *.iso)
                echo "::error file=${file}::unsplit ISO ${file} must never be published as a release asset"
                status=1
                ;;
            esac
          done

          for checksum in output/*.iso.sha256; do
            iso=${checksum%.sha256}
            parts=( "${iso}.part"[0-9]* )
            if (( ${#parts[@]} == 0 )) || [[ ! -f ${iso}.parts.sha256 ]]; then
              echo "::error file=${checksum}::${iso} has no numbered parts or parts manifest"
              status=1
            fi
          done

          if (( status != 0 )); then
            echo "Release asset verification failed; nothing may be published." >&2
            ls -la output >&2 || true
            exit 1
          fi
          echo "All release assets are below ${limit} bytes and consist of numbered parts plus checksums."
      - name: Publish release assets
        if: inputs.release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          fail_on_unmatched_files: true
          files: |
            output/*.iso.part[0-9]*
            output/*.sha256
