name: Build & Validate Yaran Linux

on:
  push:
    branches: [main]
    paths:
      - 'Yaran-2.0-*.json'
      - 'Yaran-Server-2.0-*.json'
      - 'build.py'
      - 'hooks/**'
      - 'scripts/**'
      - 'tests/**'
      - 'examples/**'
      - 'assets/**'
      - 'yaran.svg'
      - 'README.md'
      - 'docs/**'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
    paths:
      - 'Yaran-2.0-*.json'
      - 'Yaran-Server-2.0-*.json'
      - 'build.py'
      - 'hooks/**'
      - 'scripts/**'
      - 'tests/**'
      - 'examples/**'
      - 'assets/**'
      - 'yaran.svg'
      - 'README.md'
      - 'docs/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unit tests and manifests
        run: |
          python3 -m unittest discover -s tests -v
          for config in Yaran*.json examples/*.json; do
            python3 build.py "$config" --validate
          done
          find hooks scripts -name '*.sh' -exec bash -n {} \;

  build-desktop:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    uses: ./.github/workflows/image.yml
    with:
      config: Yaran-2.0-${{ matrix.arch }}.json
      runner: ${{ matrix.runner }}
      artifact: yaran-${{ matrix.arch }}

  build-server:
    needs: validate
    uses: ./.github/workflows/image.yml
    with:
      config: Yaran-Server-2.0-amd64.json
      runner: ubuntu-latest
      artifact: yaran-server-amd64
