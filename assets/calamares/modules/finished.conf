---
# Shown after a fully successful install (Calamares only reaches the finished
# page when every exec step succeeded — a failed install shows the error page
# and never offers a restart).
#
# The user can untick the checkbox; when it is ticked, clicking "Done" runs
# restartNowCommand through Calamares' official restart mechanism, which
# reboots the installed system cleanly from the live session.
restartNowEnabled: true
restartNowChecked: true
restartNowCommand: "systemctl reboot"
